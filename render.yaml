services:
  - type: web
    name: idx-witcher-api
    runtime: docker
    rootDir: apps/api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idx-witcher-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: CORS_ORIGINS
        value: "https://web-flax-eight-69.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: FINNHUB_API_KEY
        sync: false
    healthCheckPath: /health

databases:
  - name: idx-witcher-db
    databaseName: idxwitcher
    user: idxwitcher
    plan: free

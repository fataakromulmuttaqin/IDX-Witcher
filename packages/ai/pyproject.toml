[project]
name = "idxwitcher-ai"
version = "0.1.0"
description = "Lightweight AI inference and portfolio optimization for IDX Witcher"
requires-python = ">=3.11"
authors = [{ name = "IDX Witcher Team" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

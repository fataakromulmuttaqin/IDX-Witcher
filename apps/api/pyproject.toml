[project]
name = "idx-witcher-api"
version = "0.1.0"
description = "IDX Witcher FastAPI backend for IDX market data and AI portfolio"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "IDX Witcher Team" },
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.0",
    "duckdb>=1.5.5",
    "pyarrow>=18.0.0",
    "httpx>=0.27.0",
    "yfinance>=0.2.59",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "APScheduler>=3.10.0",
    "curl-cffi>=0.15.0; platform_machine == 'AMD64' or platform_machine == 'x86_64'",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
